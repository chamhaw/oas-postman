[tools]
go = "1.25.6"

[env]
GOTOOLCHAIN = "local"
GOWORK = "off"

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.build]
description = "Build the oas-postman binary"
run = "go build -o dist/oas-postman ./cmd/oas-postman"

[tasks.check]
description = "Run tests, vet, and build"
run = """
go test ./...
go vet ./...
go build -o dist/oas-postman ./cmd/oas-postman
"""
